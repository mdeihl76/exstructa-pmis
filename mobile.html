<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Squared Field</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1d2d3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Squared Field">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d1f20; --paper:#f2f2f3; --card:#ffffff; --line:#e0e0e0;
    --muted:#6f7276; --sidebar-bg:#1d2d3d; --sidebar-bg-2:#2b3d50;
    --good:#2f8a5b; --good-bg:#e6f4ec; --amber:#b8752b; --amber-bg:#f7ecd6;
    --red:#c0503f; --red-bg:#fdeceb;
    --sans:'Barlow','Segoe UI',system-ui,sans-serif;
    --sans-heading:'Barlow Condensed','Barlow',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;height:100%;overflow-x:hidden;}
  button,input,textarea,select{font-family:inherit;}
  /* This is a field tool used one-thumbed in daylight, not a desktop worksheet
     — every tap target is large, every screen is single-column, and nothing
     requires precision pointing the way a dense table does. */
  .screen{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{background:linear-gradient(135deg,var(--sidebar-bg),var(--sidebar-bg-2));color:#fff;
    padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;align-items:center;justify-content:space-between;flex:none;}
  .topbar h1{font-family:var(--sans-heading);font-size:19px;font-weight:600;margin:0;}
  .topbar .sub{font-size:11.5px;color:#9fb3c4;margin-top:1px;}
  .topbar button{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);
    color:#fff;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;}
  .content{flex:1;padding:18px 16px 24px;max-width:520px;width:100%;margin:0 auto;}
  .content.with-tabbar{padding-bottom:calc(84px + env(safe-area-inset-bottom));}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;
    margin-bottom:14px;}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;display:block;}
  input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{
    width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;
    font-size:16px;background:#fff;margin-bottom:14px;}
  textarea{resize:vertical;min-height:60px;}
  label.check-row{display:flex;align-items:center;gap:10px;font-size:15px;margin-bottom:14px;}
  label.check-row input{width:20px;height:20px;margin:0;}
  .btn{display:block;width:100%;padding:16px;border:none;border-radius:12px;
    font-size:16px;font-weight:700;cursor:pointer;text-align:center;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-camera{background:var(--sidebar-bg);color:#fff;display:flex;align-items:center;
    justify-content:center;gap:10px;padding:22px;font-size:17px;}
  .btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
  .btn[disabled]{opacity:.5;}
  .err{background:var(--red-bg);color:var(--red);padding:10px 12px;border-radius:8px;
    font-size:13px;margin-bottom:14px;display:none;}
  .proj-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;
    margin-bottom:10px;font-weight:600;font-size:15.5px;cursor:pointer;}
  .proj-item:active{background:var(--paper);}
  h2{font-family:var(--sans-heading);font-size:20px;margin:4px 0 16px;}
  .queue-item{display:flex;gap:12px;align-items:center;padding:10px 0;
    border-bottom:1px solid var(--line);}
  .queue-item:last-child{border-bottom:none;}
  .queue-thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none;
    background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:20px;}
  .queue-meta{flex:1;min-width:0;}
  .queue-meta .cap{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .queue-meta .status{font-size:11.5px;margin-top:2px;}
  .status.pending{color:var(--amber);}
  .status.done{color:var(--good);}
  .status.error{color:var(--red);}
  .banner{padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:14px;
    display:flex;align-items:center;gap:8px;}
  .banner.offline{background:var(--amber-bg);color:var(--amber);}
  .banner.synced{background:var(--good-bg);color:var(--good);}
  .hidden{display:none !important;}
  .center-msg{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;}
  .review-thumb{width:100%;border-radius:12px;margin-bottom:14px;max-height:320px;
    object-fit:cover;background:var(--paper);}

  /* ---- bottom tab bar ---- */
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10;}
  .tabbar button{flex:1;background:none;border:none;padding:10px 4px 8px;font-size:11px;
    font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;
    gap:2px;border-radius:0;}
  .tabbar button.active{color:var(--ink);}
  .tabbar .tabicon{font-size:20px;}

  /* ---- Site Diary quick-log ---- */
  .quicklog-row{display:flex;gap:8px;margin-bottom:14px;}
  .quicklog-btn{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
    padding:14px 6px;font-size:12.5px;font-weight:700;color:var(--ink);text-align:center;}
  .quicklog-btn .qicon{font-size:22px;display:block;margin-bottom:4px;}
  .quicklog-btn:active{background:var(--paper);}

  /* ---- Drawings list ---- */
  .drawing-item{display:flex;flex-direction:column;gap:2px;}
  .drawing-no{font-family:var(--sans-heading);font-size:16px;font-weight:700;}
  .drawing-title{font-size:13.5px;color:var(--ink);font-weight:500;}
  .drawing-rev{font-size:12px;color:var(--muted);margin-top:2px;}
</style>
</head>
<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   SQUARED FIELD — mobile companion app
   Photos (camera capture), Site Diary (quick log entries), Defects
   (log a defect with photos), and Drawings (read-only viewer) — the
   tools scoped for mobile use out on site.

   Deliberately a SEPARATE file/codebase from index.html, not a
   responsive mode of the desktop app. Shares the same Supabase
   project (same URL/anon key, same auth, same project_data), so
   anything captured here is immediately visible in the desktop
   app's own tabs too — Photos, Site Diary, and (read-only)
   Drawings all read/write the exact same state shape the desktop
   app uses, verbatim.

   KNOWN LIMITATION, stated plainly rather than hidden: photo and
   site diary data both live inside each project's single
   project_data JSON blob, the same as everywhere else in this
   app today. Saving anything here means read that whole blob,
   change one piece of it, write the whole blob back — exactly
   what the desktop app's own scheduleSave() already does. If
   someone has the desktop app open on the same project at the
   same moment something syncs from the field, whichever save
   lands last wins and the other's in-flight edits are silently
   lost. Not a new risk — desktop already carries it between two
   open tabs — just a second surface that can now trigger it.
   EVERY write from this app (photos AND diary logs) is therefore
   run through ONE single global sequential queue (see
   trySyncQueue() below) rather than two independent ones, so this
   app can at least never collide with itself — a photo syncing
   and a diary log syncing at the same moment would otherwise
   silently overwrite each other's change to the same blob. The
   real, complete fix is giving photos and site diary entries
   their own database rows instead of living inside project_data,
   so a field update can never collide with an unrelated desktop
   edit at all — worth doing before this is a whole crew's daily
   habit, not necessarily before it's useful enough to keep using.

   Drawings is read-only here (viewing only, no markup/editing —
   see the project notes on why), so it carries none of the above
   risk: it's a single read of project_data plus a Storage
   download, never a write.
   ============================================================ */

const SUPABASE_URL = "https://ynlqvwerhlifcisyfnbg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubHF2d2VyaGxpZmNpc3lmbmJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTU3MzAsImV4cCI6MjEwMTg3MTczMH0.O0bNhODBOwTV8ulvgXowOn9UNAb-fbipQFvYSYHu-1E";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const CLOUD_FILES_BUCKET = 'project-files';
const FIELD_ALBUM_NAME = 'Field Photos (mobile)';

const uid = () => Math.random().toString(36).slice(2, 9);
const todayIso = () => new Date().toISOString().slice(0, 10);
function fmtDate(iso){
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(d,10)} ${months[parseInt(m,10)-1]} ${y}`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

// ---------- IndexedDB-backed offline queues ----------
// Two object stores — pending_photos (unchanged from the Photos-only version)
// and pending_diary_logs (new) — sharing one small set of generic
// get/add/remove helpers, since both now need identical retry/error/timeout
// handling. They stay separate stores (not one merged shape) because a
// photo record and a diary-log record hold genuinely different fields, and
// forcing them into one shape would just make both harder to read.
const QUEUE_DB = 'squared_field_v1';
const QUEUE_DB_VERSION = 3; // v1: pending_photos. v2: +pending_diary_logs. v3: +pending_defects.
function openQueueDb(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(QUEUE_DB, QUEUE_DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('pending_photos')) db.createObjectStore('pending_photos', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('pending_diary_logs')) db.createObjectStore('pending_diary_logs', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('pending_defects')) db.createObjectStore('pending_defects', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function queueAdd(store, record){
  const db = await openQueueDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(record);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function queueAll(store){
  const db = await openQueueDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function queueRemove(store, id){
  const db = await openQueueDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// ---------- app state ----------
let currentUser = null;
let currentProjectId = localStorage.getItem('sf_project_id') || null;
let currentProjectName = '';
let syncing = false;
let activeTab = 'photos'; // 'photos' | 'diary' | 'drawings'

const app = document.getElementById('app');
function render(html){ app.innerHTML = html; }

// ---------- login / project picker ----------
function renderLogin(errorMsg){
  render(`
    <div class="screen">
      <div class="topbar"><div><h1>Squared Field</h1></div></div>
      <div class="content">
        <div class="card">
          <h2>Log in</h2>
          <div class="err" id="login-err" style="${errorMsg ? 'display:block;' : ''}">${errorMsg || ''}</div>
          <label class="lbl">Email</label>
          <input type="email" id="login-email" autocomplete="username">
          <label class="lbl">Password</label>
          <input type="password" id="login-pass" autocomplete="current-password">
          <button class="btn btn-primary" id="login-btn">Log in</button>
        </div>
        <p style="text-align:center;color:var(--muted);font-size:12.5px;">
          Same login as the main Squared app.
        </p>
      </div>
    </div>
  `);
  document.getElementById('login-btn').addEventListener('click', doLogin);
  document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  if (!email || !password){ showLoginError('Enter your email and password.'); return; }
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Logging in…';
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error){ showLoginError(error.message); btn.disabled = false; btn.textContent = 'Log in'; return; }
  currentUser = data.user;
  boot();
}
function showLoginError(msg){
  const el = document.getElementById('login-err');
  el.textContent = msg; el.style.display = 'block';
}

async function renderProjectPicker(){
  render(`
    <div class="screen">
      <div class="topbar">
        <div><h1>Squared Field</h1></div>
        <button id="logout-btn">Log out</button>
      </div>
      <div class="content">
        <h2>Choose a project</h2>
        <div id="proj-list"><p class="center-msg">Loading projects…</p></div>
      </div>
    </div>
  `);
  document.getElementById('logout-btn').addEventListener('click', doLogout);

  const { data: projects, error } = await supabaseClient
    .from('projects').select('id, name').order('name');
  const list = document.getElementById('proj-list');
  if (error){
    list.innerHTML = `<div class="err" style="display:block;">Could not load projects — ${escapeHtml(error.message)}</div>`;
    return;
  }
  if (!projects || !projects.length){
    list.innerHTML = `<p class="center-msg">No projects available on this account yet. Open the main Squared app to create one first.</p>`;
    return;
  }
  list.innerHTML = projects.map(p => `<div class="proj-item" data-id="${p.id}" data-name="${escapeHtml(p.name || 'Untitled Project')}">${escapeHtml(p.name || 'Untitled Project')}</div>`).join('');
  list.querySelectorAll('.proj-item').forEach(el => {
    el.addEventListener('click', () => {
      currentProjectId = el.dataset.id;
      currentProjectName = el.dataset.name;
      localStorage.setItem('sf_project_id', currentProjectId);
      localStorage.setItem('sf_project_name', currentProjectName);
      activeTab = 'photos';
      renderActiveTab();
    });
  });
}

function doLogout(){
  supabaseClient.auth.signOut();
  localStorage.removeItem('sf_project_id');
  localStorage.removeItem('sf_project_name');
  currentProjectId = null;
  renderLogin();
}

// ---------- shared shell: topbar + content slot + tab bar ----------
const TAB_META = {
  photos:   { label: 'Photos',     icon: '📷' },
  diary:    { label: 'Site Diary', icon: '📓' },
  defects:  { label: 'Defects',    icon: '🛠️' },
  drawings: { label: 'Drawings',   icon: '📐' }
};

function renderShell(title, innerHtml){
  const tabs = Object.keys(TAB_META).map(key => {
    const m = TAB_META[key];
    return `<button class="tab-btn ${key === activeTab ? 'active' : ''}" data-tab="${key}">
      <span class="tabicon">${m.icon}</span>${m.label}
    </button>`;
  }).join('');

  render(`
    <div class="screen">
      <div class="topbar">
        <div>
          <h1>${escapeHtml(title)}</h1>
          <div class="sub">${escapeHtml(currentProjectName || 'Project')}</div>
        </div>
        <button id="switch-proj-btn">Switch</button>
      </div>
      <div class="content with-tabbar" id="tab-content">${innerHtml}</div>
      <div class="tabbar">${tabs}</div>
    </div>
  `);

  document.getElementById('switch-proj-btn').addEventListener('click', () => {
    currentProjectId = null;
    renderProjectPicker();
  });
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderActiveTab();
    });
  });
}

function renderActiveTab(){
  currentProjectName = localStorage.getItem('sf_project_name') || currentProjectName;
  if (activeTab === 'photos') renderPhotosScreen();
  else if (activeTab === 'diary') renderDiaryScreen();
  else if (activeTab === 'defects') renderDefectsScreen();
  else renderDrawingsScreen();
}

// ============================================================
// PHOTOS
// ============================================================
let capturedFile = null;

async function renderPhotosScreen(){
  renderShell('Photos', `
    <div id="net-banner"></div>
    <input type="file" accept="image/*" capture="environment" id="camera-input" class="hidden">
    <button class="btn btn-camera" id="take-photo-btn">📷 Take Photo</button>
    <div id="review-card"></div>
    <div class="card" id="queue-card" style="display:none;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <span class="lbl" style="margin:0;">Pending upload</span>
        <button class="btn-ghost btn" style="width:auto;padding:6px 12px;font-size:12px;" id="sync-now-btn">Sync now</button>
      </div>
      <div id="queue-list"></div>
    </div>
  `);

  document.getElementById('take-photo-btn').addEventListener('click', () => {
    document.getElementById('camera-input').click();
  });
  document.getElementById('camera-input').addEventListener('change', onPhotoCaptured);
  document.getElementById('sync-now-btn').addEventListener('click', () => trySyncQueue(true));

  updateNetBanner();
  await refreshPhotoQueueList();
}

function onPhotoCaptured(e){
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  capturedFile = file;
  const url = URL.createObjectURL(file);
  document.getElementById('review-card').innerHTML = `
    <div class="card">
      <img src="${url}" class="review-thumb" alt="">
      <label class="lbl">Caption (optional)</label>
      <input type="text" id="caption-input" placeholder="e.g. Level 2 slab pour">
      <button class="btn btn-primary" id="save-photo-btn">Save Photo</button>
    </div>
  `;
  document.getElementById('save-photo-btn').addEventListener('click', savePhoto);
}

async function savePhoto(){
  const caption = document.getElementById('caption-input').value.trim();
  const file = capturedFile;
  const btn = document.getElementById('save-photo-btn');
  btn.disabled = true; btn.textContent = 'Saving…';

  // Read the file into raw bytes NOW, at capture time, rather than storing
  // the File object itself in IndexedDB. This matters specifically on
  // mobile Safari: File objects put into IndexedDB can come back empty
  // (0 bytes) when read back moments later — a long-standing WebKit bug —
  // which is exactly what produced the "No content provided" upload error.
  // A plain ArrayBuffer has none of that fragility.
  const arrayBuffer = await file.arrayBuffer();

  const record = {
    id: uid(),
    projectId: currentProjectId,
    fileKey: 'photo_' + uid(),
    filename: file.name || ('field_' + Date.now() + '.jpg'),
    caption,
    capturedAt: new Date().toISOString(),
    sizeBytes: file.size,
    mimeType: file.type || 'image/jpeg',
    arrayBuffer
  };

  await queueAdd('pending_photos', record);
  capturedFile = null;
  document.getElementById('review-card').innerHTML = '';
  document.getElementById('camera-input').value = '';
  await refreshPhotoQueueList();
  trySyncQueue();
}

async function uploadOnePhoto(record){
  const blob = new Blob([record.arrayBuffer], { type: record.mimeType || 'image/jpeg' });
  if (!blob.size) throw new Error('Photo data was empty when read back from local storage — please retake this photo.');

  const path = `${record.projectId}/photos/${record.fileKey}`;
  const { error: uploadErr } = await supabaseClient.storage
    .from(CLOUD_FILES_BUCKET)
    .upload(path, blob, { upsert: true, contentType: blob.type || 'image/jpeg' });
  if (uploadErr) throw uploadErr;

  const { data: row, error: readErr } = await supabaseClient
    .from('projects').select('project_data').eq('id', record.projectId).single();
  if (readErr) throw readErr;

  const projectData = row.project_data || {};
  if (!projectData.photos || typeof projectData.photos !== 'object') projectData.photos = { albums: [], items: [] };
  if (!Array.isArray(projectData.photos.albums)) projectData.photos.albums = [];
  if (!Array.isArray(projectData.photos.items)) projectData.photos.items = [];

  let album = projectData.photos.albums.find(a => a.name === FIELD_ALBUM_NAME);
  if (!album){
    album = { id: uid(), name: FIELD_ALBUM_NAME, description: 'Uploaded from the Squared Field mobile app.', createdDate: todayIso() };
    projectData.photos.albums.push(album);
  }
  const existingInAlbum = projectData.photos.items.filter(p => p.albumId === album.id);
  const maxOrder = existingInAlbum.reduce((m, p) => Math.max(m, p.order || 0), 0);

  projectData.photos.items.push({
    id: uid(),
    albumId: album.id,
    fileKey: record.fileKey,
    filename: record.filename,
    caption: record.caption || '',
    dateTaken: record.capturedAt.slice(0, 10),
    notes: '',
    sizeBytes: record.sizeBytes,
    uploadedDate: todayIso(),
    order: maxOrder + 1
  });

  const { error: writeErr } = await supabaseClient
    .from('projects').update({ project_data: projectData }).eq('id', record.projectId).select('id');
  if (writeErr) throw writeErr;
}

async function refreshPhotoQueueList(){
  const all = await queueAll('pending_photos');
  const mine = all.filter(r => r.projectId === currentProjectId);
  const card = document.getElementById('queue-card');
  const list = document.getElementById('queue-list');
  if (!card) return; // not the active screen any more
  if (!mine.length){ card.style.display = 'none'; return; }
  card.style.display = '';
  list.innerHTML = mine.map(r => {
    const url = URL.createObjectURL(new Blob([r.arrayBuffer], { type: r.mimeType || 'image/jpeg' }));
    const statusHtml = r.lastError
      ? `<div class="status error">${escapeHtml(r.lastError)}</div>`
      : `<div class="status pending">Waiting to sync…</div>`;
    return `
      <div class="queue-item">
        <img src="${url}" class="queue-thumb" alt="">
        <div class="queue-meta">
          <div class="cap">${escapeHtml(r.caption || r.filename)}</div>
          ${statusHtml}
        </div>
      </div>`;
  }).join('');
}

// ============================================================
// SITE DIARY — quick, independent log entries

  delivery: { label: 'Delivery', icon: '📦' },

async function saveDiaryLog(logType, fields){
  const btn = document.getElementById('df-save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';

  const record = {
    id: uid(),
    projectId: currentProjectId,
    logType,
    date: todayIso(),
    fields,
    capturedAt: new Date().toISOString()
  };
  await queueAdd('pending_diary_logs', record);
  document.getElementById('diary-form-card').innerHTML = '';
  await refreshDiaryQueueList();
  trySyncQueue();
}

// Builds today's entry fresh with the exact same shape freshSiteDiaryEntry()
// uses on desktop, so a mobile-created day looks identical to a desktop-
// created one in every other respect.
function freshSiteDiaryEntryShape(date){
  return {
    id: uid(), date, workedToday: true,
    weather: { condition: '', tempC: '', notes: '' },
    subs: [], deliveries: [], additionalWorks: [], delays: [], incidents: [],
    notes: '', preparedBy: '',
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };
}

async function uploadOneDiaryLog(record){
  const { data: row, error: readErr } = await supabaseClient
    .from('projects').select('project_data').eq('id', record.projectId).single();
  if (readErr) throw readErr;

  const projectData = row.project_data || {};
  if (!projectData.siteDiary || typeof projectData.siteDiary !== 'object') projectData.siteDiary = { entries: [] };
  if (!Array.isArray(projectData.siteDiary.entries)) projectData.siteDiary.entries = [];

  let entry = projectData.siteDiary.entries.find(e => e.date === record.date);
  if (!entry){
    entry = freshSiteDiaryEntryShape(record.date);
    projectData.siteDiary.entries.push(entry);
  }
  if (!Array.isArray(entry.delays)) entry.delays = [];
  if (!Array.isArray(entry.deliveries)) entry.deliveries = [];
  if (!Array.isArray(entry.incidents)) entry.incidents = [];

  const f = record.fields;
  if (record.logType === 'delay'){
    entry.delays.push({ id: uid(), cause: f.cause || '', description: f.description || '', daysLost: f.daysLost || 0, eot: !!f.eot });
  } else if (record.logType === 'delivery'){
    entry.deliveries.push({ id: uid(), supplier: f.supplier || '', description: f.description || '', docketRef: f.docketRef || '', notes: '' });
  } else if (record.logType === 'incident'){
    entry.incidents.push({ id: uid(), type: f.type || 'Near Miss', description: f.description || '', personInvolved: f.personInvolved || '', actionTaken: f.actionTaken || '' });
  }
  entry.updatedAt = new Date().toISOString();

  const { error: writeErr } = await supabaseClient
    .from('projects').update({ project_data: projectData }).eq('id', record.projectId).select('id');
  if (writeErr) throw writeErr;
}

async function refreshDiaryQueueList(){
  const all = await queueAll('pending_diary_logs');
  const mine = all.filter(r => r.projectId === currentProjectId);
  const card = document.getElementById('diary-queue-card');
  const list = document.getElementById('diary-queue-list');

  card.style.display = '';

    const meta = QUICKLOG_META[r.logType] || { label: r.logType, icon: '📝' };
    const title = r.fields.description || r.fields.cause || r.fields.supplier || meta.label;
    const statusHtml = r.lastError
      ? `<div class="status error">${escapeHtml(r.lastError)}</div>`

    return `
      <div class="queue-item">
        <div class="queue-thumb">${meta.icon}</div>
        <div class="queue-meta">
          <div class="cap">${meta.label}: ${escapeHtml(title)}</div>

      </div>`;
  }).join('');
}

// ============================================================
// DEFECTS — log a defect on site with photos, queued and synced the same
// way Photos/Site Diary are. Unlike Photos (queues the instant a photo is
// captured), a defect bundles its text fields AND however many photos were
// taken into ONE queued record, saved together with a single "Save Defect"
// tap — a defect record isn't really "complete" with just a photo or just
// a description on its own the way a single site photo is.
// ============================================================
let defectPhotoDrafts = []; // photos captured for the defect currently being filled in, not yet saved/queued

async function renderDefectsScreen(){
  defectPhotoDrafts = [];
  renderShell('Defects', `

async function onDefectPhotoCaptured(e){
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  // Same anti-Safari-bug technique as savePhoto() above — read to raw bytes
  // immediately at capture time rather than holding onto the File object.
  const arrayBuffer = await file.arrayBuffer();
  defectPhotoDrafts.push({
    fileKey: 'defectphoto_' + uid(),
    filename: file.name || ('defect_' + Date.now() + '.jpg'),
    mimeType: file.type || 'image/jpeg',
    sizeBytes: file.size,
    arrayBuffer
  });
  document.getElementById('def-camera-input').value = '';
  renderDefectPhotoThumbs();
}

function renderDefectPhotoThumbs(){
  const wrap = document.getElementById('def-photo-thumbs');
  if (!wrap) return;
  if (!defectPhotoDrafts.length){ wrap.innerHTML = ''; return; }
  wrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;';
  wrap.innerHTML = defectPhotoDrafts.map((p, i) => {
    const url = URL.createObjectURL(new Blob([p.arrayBuffer], { type: p.mimeType || 'image/jpeg' }));
    return `<div style="position:relative;width:72px;height:72px;">
      <img src="${url}" style="width:72px;height:72px;border-radius:8px;object-fit:cover;display:block;" alt="">
      <button data-idx="${i}" class="def-photo-remove" style="position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
        background:var(--red);color:#fff;border:2px solid #fff;font-size:12px;line-height:1;padding:0;">✕</button>
    </div>`;
  }).join('');
  wrap.querySelectorAll('.def-photo-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      defectPhotoDrafts.splice(parseInt(btn.dataset.idx, 10), 1);
      renderDefectPhotoThumbs();
    });
  });
}

async function saveDefect(){
  const btn = document.getElementById('def-save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';

  const record = {
    id: uid(),
    projectId: currentProjectId,
    name: document.getElementById('def-name').value.trim(),
    location: document.getElementById('def-location').value.trim(),
    description: document.getElementById('def-description').value.trim(),
    capturedAt: new Date().toISOString(),
    photos: defectPhotoDrafts
  };
  await queueAdd('pending_defects', record);
  defectPhotoDrafts = [];
  document.getElementById('def-name').value = '';
  document.getElementById('def-location').value = '';
  document.getElementById('def-description').value = '';
  renderDefectPhotoThumbs();
  btn.disabled = false; btn.textContent = 'Save Defect';
  await refreshDefectsQueueList();
  trySyncQueue();
}

async function uploadOneDefect(record){
  // Photos upload to Storage first, same path convention as the desktop
  // app's DefectPhotoStore (makeCloudFileStore('defectphotos', ...)):
  // <projectId>/defectphotos/<fileKey>.
  for (const p of record.photos){
    const blob = new Blob([p.arrayBuffer], { type: p.mimeType || 'image/jpeg' });
    if (!blob.size) throw new Error(`Photo data for "${p.filename}" was empty when read back — please retake it.`);
    const path = `${record.projectId}/defectphotos/${p.fileKey}`;
    const { error: uploadErr } = await supabaseClient.storage
      .from(CLOUD_FILES_BUCKET)
      .upload(path, blob, { upsert: true, contentType: blob.type || 'image/jpeg' });
    if (uploadErr) throw uploadErr;
  }

  const { data: row, error: readErr } = await supabaseClient
    .from('projects').select('project_data').eq('id', record.projectId).single();
  if (readErr) throw readErr;

  const projectData = row.project_data || {};
  if (!Array.isArray(projectData.defects)) projectData.defects = [];
  if (!projectData.defectCounter) projectData.defectCounter = 0;
  projectData.defectCounter += 1;
  // Same Job Number prefix convention as the desktop app's jobPrefix() —
  // duplicated here in miniature since this file shares no code with
  // index.html. Falls back to no prefix if a Job Number hasn't been
  // assigned to this project yet, matching jobPrefix()'s own behaviour.
  const jobNumber = projectData.project && projectData.project.jobNumber;
  const refNo = (jobNumber ? jobNumber + '-' : '') + 'DEF-' + String(projectData.defectCounter).padStart(3, '0');

  projectData.defects.push({
    id: uid(),
    refNo,
    name: record.name || '',
    date: record.capturedAt.slice(0, 10),
    location: record.location || '',
    description: record.description || '',
    status: 'Open',
    photos: record.photos.map(p => ({ id: uid(), fileKey: p.fileKey, filename: p.filename, sizeBytes: p.sizeBytes, uploadedDate: todayIso() }))
  });

  const { error: writeErr } = await supabaseClient
    .from('projects').update({ project_data: projectData }).eq('id', record.projectId).select('id');
  if (writeErr) throw writeErr;
}

async function refreshDefectsQueueList(){
  const all = await queueAll('pending_defects');
  const mine = all.filter(r => r.projectId === currentProjectId);
  const card = document.getElementById('defects-queue-card');
  const list = document.getElementById('defects-queue-list');
  if (!card) return; // not the active screen any more
  if (!mine.length){ card.style.display = 'none'; return; }
  card.style.display = '';
  list.innerHTML = mine.map(r => {
    const firstPhoto = r.photos && r.photos[0];
    const thumbHtml = firstPhoto
      ? `<img src="${URL.createObjectURL(new Blob([firstPhoto.arrayBuffer], { type: firstPhoto.mimeType || 'image/jpeg' }))}" class="queue-thumb" alt="">`
      : `<div class="queue-thumb">🛠️</div>`;
    const statusHtml = r.lastError
      ? `<div class="status error">${escapeHtml(r.lastError)}</div>`
      : `<div class="status pending">Waiting to sync…</div>`;
    return `
      <div class="queue-item">

// ============================================================
// DRAWINGS — read-only viewer
// No offline queue here at all: nothing is ever written from this screen,
// just a read of project_data plus a Storage download when a sheet is
// opened, so there's no collision risk to design around.
// ============================================================
const CDRAWINGS_FOLDER = 'cdrawings';

async function renderDrawingsScreen(){
  renderShell('Drawings', `
    <div id="net-banner"></div>
    <div id="drawings-list"><p class="center-msg">Loading drawings…</p></div>
  `);
  updateNetBanner();

  const { data: row, error } = await supabaseClient
    .from('projects').select('project_data').eq('id', currentProjectId).single();
  const list = document.getElementById('drawings-list');
  if (!list) return; // navigated away already
  if (error){
    list.innerHTML = `<div class="err" style="display:block;">Could not load drawings — ${escapeHtml(error.message)}</div>`;
    return;
  }

  const cd = (row.project_data && row.project_data.cdrawings) || {};
  const sheets = Array.isArray(cd.sheets) ? cd.sheets : [];
  const revisions = Array.isArray(cd.revisions) ? cd.revisions : [];

  if (!sheets.length){
    list.innerHTML = `<p class="center-msg">No drawings uploaded to this project yet — add them from the Drawings tool in the main Squared app.</p>`;
    return;
  }

  const sorted = sheets.slice().sort((a, b) =>
    (a.sheetNumber || '').localeCompare(b.sheetNumber || '', undefined, { numeric: true }));

  list.innerHTML = sorted.map(sheet => {
    const rev = revisions.find(r => r.id === sheet.currentRevisionId);
    const pageNote = rev && rev.pageIndexInFile != null ? ` (page ${rev.pageIndexInFile + 1})` : '';
    const revLabel = rev
      ? `Rev ${escapeHtml(rev.revCode || '—')} · ${rev.date ? escapeHtml(fmtDate(rev.date)) : '—'}${pageNote}`
      : 'No current revision';
    return `<div class="proj-item drawing-item" data-sheet-id="${sheet.id}">
      <div class="drawing-no">${escapeHtml(sheet.sheetNumber || '—')}</div>
      <div class="drawing-title">${escapeHtml(sheet.title || '(untitled)')}</div>
      <div class="drawing-rev">${revLabel}</div>
    </div>`;
  }).join('');

  list.querySelectorAll('.drawing-item').forEach(el => {
    el.addEventListener('click', () => openDrawing(el.dataset.sheetId, sheets, revisions));
  });
}

async function openDrawing(sheetId, sheets, revisions){
  const sheet = sheets.find(s => s.id === sheetId);
  if (!sheet || !sheet.currentRevisionId){ alert('This sheet has no current revision to view.'); return; }
  const rev = revisions.find(r => r.id === sheet.currentRevisionId);
  if (!rev){ alert('Could not find this revision.'); return; }

  const list = document.getElementById('drawings-list');
  const prevHtml = list.innerHTML;
  list.innerHTML = `<p class="center-msg">Opening ${escapeHtml(sheet.sheetNumber || '')}…</p>`;

  try{
    const path = `${currentProjectId}/${CDRAWINGS_FOLDER}/${rev.fileKey}`;
    const { data: blob, error } = await withTimeout(
      supabaseClient.storage.from(CLOUD_FILES_BUCKET).download(path), 25000, 'Download'
    );
    if (error) throw error;
    const url = URL.createObjectURL(blob);
    // Navigating in the same tab hands off to the phone's own native PDF
    // viewer — full pinch-zoom/pan/page-scroll for free, no bundling a PDF
    // renderer into this app. The browser's back gesture returns here.
    window.location.href = url;
  }catch(e){
    list.innerHTML = prevHtml;
    list.querySelectorAll('.drawing-item').forEach(el => {
      el.addEventListener('click', () => openDrawing(el.dataset.sheetId, sheets, revisions));
    });
    alert('Could not open this drawing — ' + ((e && e.message) || 'check your connection and try again.'));
  }
}

// ============================================================
// SYNC ENGINE — one single global queue across Photos and Site Diary
// ============================================================
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} timed out after ${ms / 1000}s — check your connection`)), ms))
  ]);
}

async function trySyncQueue(manual){
  if (syncing) return;
  syncing = true;
  if (manual) updateNetBanner('syncing');

  // Every project_data write this app can make — photos AND diary logs —
  // is drained through this ONE sequential loop, not two independent ones.
  // Running a photo-sync and a diary-log-sync at the same moment would each
  // read project_data, change their own piece, and write back — the second
  // write would silently discard the first's change, since both are
  // touching the same row. One global queue makes that impossible: nothing
  // this app writes to project_data ever overlaps with anything else it
  // writes, even across different tools.
  const photos = (await queueAll('pending_photos'))
    .filter(r => r.projectId === currentProjectId)
    .map(r => ({ store: 'pending_photos', record: r, upload: uploadOnePhoto }));
  const logs = (await queueAll('pending_diary_logs'))
    .filter(r => r.projectId === currentProjectId)
    .map(r => ({ store: 'pending_diary_logs', record: r, upload: uploadOneDiaryLog }));
  const defects = (await queueAll('pending_defects'))
    .filter(r => r.projectId === currentProjectId)
    .map(r => ({ store: 'pending_defects', record: r, upload: uploadOneDefect }));

  for (const item of [...photos, ...logs, ...defects]){
    try{
      await withTimeout(item.upload(item.record), 25000, 'Sync');
      await queueRemove(item.store, item.record.id);
    }catch(e){
      console.warn('Sync failed for', item.store, item.record.id, e);
      item.record.lastError = (e && e.message) || 'Sync failed — will retry automatically.';
      item.record.lastAttempt = new Date().toISOString();
      await queueAdd(item.store, item.record);
    }
  }

  syncing = false;
  updateNetBanner();
  // Only the currently-visible screen's list elements exist in the DOM —
  // both refresh functions already guard on that and simply no-op otherwise.
  await refreshPhotoQueueList();
  await refreshDiaryQueueList();
  await refreshDefectsQueueList();
}

// Retries any still-pending items every 20s, so a transient failure (a
// dropped connection mid-upload, a brief RLS hiccup) clears itself up
// without someone needing to remember to tap "Sync now" again.
setInterval(() => { if (currentProjectId) trySyncQueue(); }, 20000);

function updateNetBanner(mode){
  const el = document.getElementById('net-banner');
  if (!el) return;
  if (mode === 'syncing'){
    el.innerHTML = `<div class="banner synced">Syncing…</div>`;
  } else if (!navigator.onLine){
    el.innerHTML = `<div class="banner offline">No connection — changes will save on this device and sync automatically once you're back online.</div>`;
  } else {
    el.innerHTML = '';
  }
}

window.addEventListener('online', () => { updateNetBanner(); trySyncQueue(); });
window.addEventListener('offline', () => updateNetBanner());

// ---------- boot ----------
async function boot(){
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user){ renderLogin(); return; }
  currentUser = user;
  if (currentProjectId){
    currentProjectName = localStorage.getItem('sf_project_name') || '';
    activeTab = 'photos';
    renderActiveTab();
    trySyncQueue();
  } else {
    renderProjectPicker();
  }
}

boot();
