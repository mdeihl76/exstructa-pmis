<title>Squared — coming soon</title>
<meta name="description" content="Squared is construction project management software built for how projects actually run, from tender to completion.">

<style>
  :root{
    /* Squared brand palette (Squared_Branding.pdf) */
    --paper:#f2f2f3;
    --ink:#1d1f20;
    --steel:#5980a6;
    --field:#2b3d50;
    --drab:#6f7276;
    --sans:'Barlow','Segoe UI',system-ui,sans-serif;
    --sans-heading:'Barlow Condensed','Barlow',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--sans);
    background:
      radial-gradient(ellipse 900px 500px at 50% 15%, var(--field) 0%, var(--ink) 70%);
    color:var(--paper);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    position:relative;
    overflow:hidden;
  }
  /* Faint blueprint grid — a nod to drawings/setout, not a literal hard-hat icon */
  body::before{
    content:'';
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(89,128,166,0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(89,128,166,0.10) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 900px 650px at 50% 40%, #000 0%, transparent 75%);
    pointer-events:none;
  }
  .wrap{
    position:relative;
    max-width:560px;
    width:100%;
    text-align:center;
  }
  .mark-lockup{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:0 0 10px;
  }
  .mark-lockup img{
    width:40px;
    height:40px;
    display:block;
  }
  .wordmark{
    font-family:var(--sans-heading);
    font-weight:700;
    font-size:32px;
    letter-spacing:.03em;
    color:var(--paper);
    text-transform:uppercase;
  }
  .tagline{
    font-size:13px;
    letter-spacing:.03em;
    color:var(--drab);
    margin:0 0 40px;
  }

  h1{
    font-family:var(--sans-heading);
    font-weight:700;
    font-size:clamp(28px, 5vw, 40px);
    line-height:1.14;
    letter-spacing:-.005em;
    margin:0 0 18px;
    color:var(--paper);
  }
  h1 em{
    font-style:normal;
    color:var(--steel);
  }

  p.sub{
    font-size:16px;
    line-height:1.6;
    color:#aeb4ba;
    max-width:440px;
    margin:0 auto 34px;
  }

  .status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:500;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#a9c2d8;
    border:1px solid rgba(89,128,166,0.45);
    border-radius:100px;
    padding:7px 16px 7px 12px;
    margin:0 0 40px;
  }
  .status .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--steel);
    box-shadow:0 0 0 3px rgba(89,128,166,0.25);
  }

  .contact{
    font-size:14px;
    color:var(--drab);
  }
  .contact a{
    color:var(--paper);
    text-decoration:none;
    border-bottom:1px solid rgba(242,242,243,0.3);
    padding-bottom:1px;
    transition:border-color .15s, color .15s;
  }
  .contact a:hover{
    color:var(--steel);
    border-color:var(--steel);
  }

  @media (max-width:480px){
    .mark-lockup img{width:32px;height:32px;}
    .wordmark{font-size:26px;}
  }
</style>
</head>
